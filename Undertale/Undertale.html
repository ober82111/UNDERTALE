<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertale Dodge Battle - Fair Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #0a001a 0%, #000 70%);
        }

        #battle-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 80vh;
            max-width: 1200px;
            border: 4px solid #4a00e0;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(10, 0, 30, 0.9);
            box-shadow: 0 0 50px rgba(74, 0, 224, 0.5);
        }

        #player {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff3366, #ff0066);
            box-shadow: 
                0 0 20px #ff0066,
                0 0 40px rgba(255, 0, 102, 0.5),
                inset 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 100;
            transition: all 0.1s ease-out;
            border: 2px solid #ffffff;
            animation: pulse 2s infinite alternate;
        }

        #player.safe-zone {
            box-shadow: 
                0 0 25px #00ff88,
                0 0 50px rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
        }

        .bullet {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.05s linear;
            opacity: 0.9;
        }

        .bullet.safe {
            opacity: 0.4;
            filter: brightness(1.5);
        }

        .heart-bullet {
            background: radial-gradient(circle at 30% 30%, #ff6699, #ff0066);
            box-shadow: 0 0 12px #ff0066;
        }

        .bone-bullet {
            background: linear-gradient(45deg, #ffffff, #e6e6e6);
            box-shadow: 0 0 8px #ffffff;
            border-radius: 3px;
        }

        .magic-bullet {
            background: radial-gradient(circle at 30% 30%, #6699ff, #3366ff);
            box-shadow: 0 0 12px #3366ff;
        }

        .spike-bullet {
            background: radial-gradient(circle at 30% 30%, #ff9966, #ff6600);
            box-shadow: 0 0 10px #ff6600;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
